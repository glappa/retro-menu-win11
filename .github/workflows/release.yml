name: Release

# Ein Tag v<Version> baut mit release.ps1 beide Dateien und legt die GitHub-Ausgabe an.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: .\release.ps1 -Publish -Tag $env:GITHUB_REF_NAME
        env:
          GH_TOKEN: ${{ github.token }}
