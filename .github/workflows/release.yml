name: Release

# Baut mit release.ps1 beide Dateien und legt die GitHub-Ausgabe v<Version> an,
# fuer einen neuen Tag v* oder von Hand gestartet (der Tag entsteht dann mit).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: .\release.ps1 -Publish
        env:
          GH_TOKEN: ${{ github.token }}
